{% extends "layout.html" %}

{% block title %}DB Viewer{% endblock %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-3">Database Viewer</h2>
    <div class="row g-3 align-items-end mb-3">
        <div class="col-auto">
            <label for="tableSelect" class="form-label">Table</label>
            <select id="tableSelect" class="form-select">
                <option value="eye_tracking_data">eye_tracking_data</option>
                <option value="user_sessions">user_sessions</option>
                <option value="notifications">notifications</option>
            </select>
        </div>
        <div class="col-auto">
            <label for="limitInput" class="form-label">Limit</label>
            <input id="limitInput" type="number" class="form-control" value="50" min="1" max="500" />
        </div>
        <div class="col-auto">
            <button id="refreshBtn" class="btn btn-primary">Refresh</button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-sm table-striped">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const tableSelect = document.getElementById('tableSelect');
    const limitInput = document.getElementById('limitInput');
    const refreshBtn = document.getElementById('refreshBtn');
    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');

    async function load() {
        const table = tableSelect.value;
        const limit = parseInt(limitInput.value) || 50;
        const res = await fetch(`/api/db-recent?table=${encodeURIComponent(table)}&limit=${limit}`);
        const data = await res.json();
        const rows = data.rows || [];

        // Build header
        head.innerHTML = '';
        body.innerHTML = '';
        if (rows.length === 0) return;
        const cols = Object.keys(rows[0]);
        const trh = document.createElement('tr');
        cols.forEach(c => {
            const th = document.createElement('th');
            th.textContent = c;
            trh.appendChild(th);
        });
        head.appendChild(trh);

        // Build body
        rows.forEach(r => {
            const tr = document.createElement('tr');
            cols.forEach(c => {
                const td = document.createElement('td');
                let v = r[c];
                if (v === null || v === undefined) v = '';
                if (typeof v === 'string' && v.length > 120) v = v.slice(0, 120) + '…';
                td.textContent = v;
                tr.appendChild(td);
            });
            body.appendChild(tr);
        });
    }

    refreshBtn.addEventListener('click', load);
    load();
});
</script>
{% endblock %}
